name: Docs

concurrency: docs-regeneration

defaults:
  run:
    shell: bash

permissions:
  contents: write
  pull-requests: write

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths:
      - "sqlc.ci.yaml"
      - "examples/authors/**"
      - "scripts/docs/**"

jobs:
  generate-docs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'

      - name: Updating Examples doc
        run: ruby scripts/docs/generate_examples.rb docs/Examples.md

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v8
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          base: main
          title: update auto-generated docs
          commit-message: update docs
          branch: update-docs
          branch-suffix: timestamp
          delete-branch: true
