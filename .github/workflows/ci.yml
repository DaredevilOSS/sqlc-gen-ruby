name: CI
defaults:
  run:
    shell: bash

permissions:
  contents: write
  pull-requests: write

on:
  push:
    branches: [ "main" ]
    paths:
      - "**"
      - "!**.md"
  pull_request:
    branches: [ "*" ]
    paths:
      - "**"
      - "!**.md"

jobs:
  test:
    name: Plugin Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      # unit tests + golden tests
      - name: Unit & golden tests
        run: bundle exec rake test

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [test]

    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      # pure Ruby plugin + prebuilt ruby.wasm interpreter, packed into one self-contained module
      - name: Build WASM plugin
        run: ./scripts/wasm/build.sh

      - name: upload wasm plugin as artifact
        uses: actions/upload-artifact@v4
        with:
          name: wasm-file
          path: dist/plugin.wasm

  codegen_test:
    name: Codegen Test
    needs: [build]
    runs-on: ubuntu-latest
    
    strategy:
      fail-fast: false
      matrix:
        ruby-version: [ '3.3' ]
        generate-types: [ 'true' ]
        generate-gemfile: [ 'false' ]

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      - name: Load .env file
        uses: xom9ikk/dotenv@v2.3.0
        with:
          load-mode: strict
          
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby-version }}
          bundler-cache: true
          
      - uses: actions/download-artifact@v4
        with:
          name: wasm-file
          path: dist
          
      - uses: sqlc-dev/setup-sqlc@v4
        with:
          sqlc-version: '1.27.0'

      - name: Updating plugin sha
        run: ./scripts/wasm/update_sha.sh ${SQLC_CI_FILE}

      - name: Codegen Test
        run: ./scripts/tests/run_codegen.sh ${SQLC_CI_FILE} \
          ${{ matrix.ruby-version }} ${{ matrix.generate-types }} ${{ matrix.generate-gemfile }}

      - name: RuboCop (generated code)
        run: rake rubocop

      - name: Steep check
        if: ${{ matrix.generate-types == 'true' }}
        run: rake steep

  end2end_tests:
    name: End-to-End Tests
    runs-on: ubuntu-latest
    needs: [build, codegen_test]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: wasm-file
          path: dist

      - uses: sqlc-dev/setup-sqlc@v4
        with:
          sqlc-version: '1.27.0'

      - name: Load .env file
        uses: xom9ikk/dotenv@v2.3.0
        with:
          load-mode: strict

      - name: Verify pushed generated code is synced
        run: |
          ./scripts/wasm/update_sha.sh ${SQLC_CI_FILE}
          sqlc -f ${SQLC_CI_FILE} diff

      - name: Docker compose
        uses: hoverkraft-tech/compose-action@v1.5.1
        with:
          services: |
            mysqldb
            postgresdb
            plugin-tests

      - name: End-to-End Tests
        run: ./scripts/tests/run_end2end.sh
