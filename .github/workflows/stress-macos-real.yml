name: Stress the real macOS E2E job (temporary)

# TEMPORARY, only on the branch that investigates the macOS E2E hang (never merged): the real cross-platform macOS
# E2E job (MySQL installed next to PostgreSQL, SQLite suite first, gem cache, generated examples), repeated, with and
# without the PostgreSQL tuning of this branch.
on:
  push:
    branches: [ci/macos-e2e-hang]
    paths:
      - .github/workflows/stress-macos-real.yml

defaults:
  run:
    shell: bash

permissions:
  contents: read

concurrency:
  group: stress-macos-real-${{ github.ref }}
  cancel-in-progress: true

env:
  DB_NAME: tests
  DB_USER: root
  DB_PASS: pass # ignored by the servers below (trust / empty-password root), required by the pg tests' env
  POSTGRES_HOST: 127.0.0.1
  MYSQL_HOST: 127.0.0.1

jobs:
  build-wasm:
    name: Build (WASM)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      # the plugin (pure Ruby) + the prebuilt ruby.wasm interpreter, packed into one self-contained module
      - name: Build WASM plugin
        run: ./scripts/wasm/build.sh

      - name: upload wasm plugin as artifact
        uses: actions/upload-artifact@v7
        with:
          name: wasm-file
          path: dist/plugin.wasm


  end2end:
    name: real job, ruby ${{ matrix.ruby-version }}, tuned=${{ matrix.tune }} #${{ matrix.rep }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10

    needs: [build-wasm]
    strategy:
      fail-fast: false
      matrix:
        ruby-version: ['3.1', '4.0']
        tune: [false, true]
        rep: [1, 2, 3]
        include:
          - { os: macos-latest, os-name: macOS, postgres-version: '16' }

    env:
      EXAMPLES_DIR: ${{ github.workspace }}/.examples-ruby-${{ matrix.ruby-version }}
      BUNDLE_GEMFILE: ${{ github.workspace }}/Gemfile.e2e
      BUNDLE_PATH: ${{ github.workspace }}/.e2e-gems

    steps:
      - uses: actions/checkout@v7

      - name: Load tool versions
        run: grep -E '^[A-Z_]+=' scripts/tool-versions.env >> "$GITHUB_ENV"

      - uses: sqlc-dev/setup-sqlc@bac53b7fb28c039a6c7f5736fd1e89744021bdd6 # v5.0.0
        with:
          sqlc-version: '${{ env.SQLC_VERSION }}'

      - uses: ankane/setup-postgres@b1a598d92f86cb2ed364411898d150d4eac6d5ca # v1
        with:
          postgres-version: ${{ matrix.postgres-version }}
          database: ${{ env.DB_NAME }}
          user: ${{ env.DB_USER }}

      - uses: ankane/setup-mysql@4aa1b08412d4c8bf537fea5bc412e4e831d839d7 # v1
        if: runner.os != 'Windows'
        with:
          mysql-version: '8.4'
          database: ${{ env.DB_NAME }}
          user: ${{ env.DB_USER }}

      # windows-2025 ships MySQL 8.4 (on PATH); setup-mysql only treats 8.0 as preinstalled there and fails to
      # reinstall 8.4 over it, so start the image's server the same way the action does
      - name: Start the preinstalled MySQL 8.4 (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $bin = 'C:\Program Files\MySQL\MySQL Server 8.4\bin'
          & "$bin\mysqld" --initialize-insecure
          & "$bin\mysqld" --install
          net start MySQL
          & "$bin\mysqladmin" -u $env:DB_USER create $env:DB_NAME

      # after the databases: their bin dirs (PostgreSQL ships its own zlib/iconv DLLs) must come after Ruby's MSYS2
      # toolchain on PATH, or gcc fails silently on Windows and no native gem builds
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby-version }}

      - uses: actions/download-artifact@v8
        with:
          name: wasm-file
          path: dist

      - name: Updating plugin sha
        run: ./scripts/wasm/update_sha.sh sqlc.ci.yaml

      # the E2E suites below run this WASM output, with the Gemfile it generates
      - name: Generate the E2E examples with the WASM
        run: ruby scripts/tests/generate_examples.rb "${{ matrix.ruby-version }}" sqlc.ci.yaml --generate-gemfile

      # the tests TRUNCATE a dozen tables in every setup and need no durability: with fsync on, a flush that stalls on a
      # macOS runner freezes the suite (both macOS E2E jobs hung inside a setup's TRUNCATEs and were cancelled after 10 minutes)
      - name: Turn off PostgreSQL durability (tests only)
        if: matrix.tune
        run: |
          psql -v ON_ERROR_STOP=1 -h "${POSTGRES_HOST}" -U "${DB_USER}" -d "${DB_NAME}" \
            -c 'ALTER SYSTEM SET fsync = off' \
            -c 'ALTER SYSTEM SET synchronous_commit = off' \
            -c 'ALTER SYSTEM SET full_page_writes = off' \
            -c 'SELECT pg_reload_conf()'

      - name: Create the schemas (and allow LOAD DATA LOCAL INFILE for :copyfrom)
        run: |
          psql -v ON_ERROR_STOP=1 -h "${POSTGRES_HOST}" -U "${DB_USER}" -d "${DB_NAME}" -f examples/authors/postgresql/schema.sql
          mysql -h "${MYSQL_HOST}" -u "${DB_USER}" -e 'SET GLOBAL local_infile = 1'
          mysql -h "${MYSQL_HOST}" -u "${DB_USER}" --default-character-set=utf8mb4 "${DB_NAME}" < examples/authors/mysql/schema.sql

      - name: Native build settings for mysql2
        run: |
          if [ "${RUNNER_OS}" = Windows ]; then
            ridk.cmd exec pacman -S --noconfirm --needed mingw-w64-ucrt-x86_64-libmariadbclient
            # mysql2's extconf can't glob for mariadb_config.exe through Windows PATH entries, so point at it
            mariadb_config=$(cygpath -m "${RI_DEVKIT}/ucrt64/bin/mariadb_config.exe")
            test -x "${mariadb_config}"
            echo "BUNDLE_BUILD__MYSQL2=--with-mysql-config=${mariadb_config}" >> "$GITHUB_ENV"
          else
            echo "BUNDLE_BUILD__MYSQL2=--with-opt-dir=$(brew --prefix openssl@3):$(brew --prefix zstd)" >> "$GITHUB_ENV"
          fi

      # prism (minitest 6), mysql2 and date compile from source on Windows (~2 min): keep the installed E2E gems, per runner
      # image (the native extensions link against its libraries)
      - name: Runner image
        id: image
        run: echo "version=${ImageOS}-${ImageVersion}" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v6
        with:
          path: ${{ env.BUNDLE_PATH }}
          key: e2e-gems-${{ steps.image.outputs.version }}-ruby${{ matrix.ruby-version }}-${{ hashFiles('Gemfile.e2e') }}

      - name: End-to-End tests (SQLite)
        if: ${{ !cancelled() }}
        timeout-minutes: 4
        env:
          EXAMPLES_DRIVER: sqlite3
        run: bundle install && bundle exec rake end2end_sqlite3

      - name: End-to-End tests (PostgreSQL ${{ matrix.postgres-version }})
        if: ${{ !cancelled() }}
        timeout-minutes: 4
        env:
          EXAMPLES_DRIVER: pg
        run: bundle install && bundle exec rake end2end_pg

      - name: End-to-End tests (MySQL 8.4)
        if: ${{ !cancelled() }}
        timeout-minutes: 5
        env:
          EXAMPLES_DRIVER: mysql2
        run: bundle install && bundle exec rake end2end_mysql2

      - name: Generator options E2E
        if: ${{ !cancelled() }}
        timeout-minutes: 3
        env:
          BUNDLE_GEMFILE: ${{ github.workspace }}/Gemfile.options.e2e
        # default gem path (only prebuilt gems): with BUNDLE_PATH, the test's nested `bundle install` on Windows Ruby
        # 3.1 trips over setup-ruby's newer Bundler next to the default 2.3 one
        run: |
          unset BUNDLE_PATH
          bundle install && bundle exec ruby tests/end2end_options.rb

      - name: Native extension build logs
        if: failure()
        run: find "$(ruby -e 'print Gem.dir')" -name mkmf.log -exec sh -c 'echo "== $1"; cat "$1"' _ {} \;
