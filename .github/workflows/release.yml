name: Release

# A release is a decision, so it is started by hand: Actions -> Release -> Run workflow (or `gh workflow run release.yml`).
# Everything after that is automatic: the full test gate runs on the commit, the tag + GitHub release are created
# with the exact plugin.wasm that was tested, and the published asset is verified by running sqlc with it.
on:
  workflow_dispatch:
    inputs:
      bump:
        description: Which part of the version to bump (ignored when 'version' is set)
        type: choice
        options: [patch, minor, major]
        default: patch
      version:
        description: "Explicit version instead of a bump, e.g. v1.0.0 (optional)"
        type: string
        required: false
      dry_run:
        description: Only compute the version and the release notes, publish nothing
        type: boolean
        default: false
      draft:
        description: Create a draft release that you publish by hand
        type: boolean
        default: false

defaults:
  run:
    shell: bash

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.ref == 'refs/heads/main' # releases are cut from main only
    outputs:
      version: ${{ steps.next.outputs.version }}
      previous: ${{ steps.next.outputs.previous }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # all tags

      - name: Compute the next version
        id: next
        env:
          BUMP: ${{ inputs.bump }}
          EXPLICIT_VERSION: ${{ inputs.version }}
        run: |
          version=$(./scripts/releasing/next_version.sh "${BUMP}" "${EXPLICIT_VERSION}")
          previous=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' | sort -V | tail -n 1)
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "previous=${previous}" >> "$GITHUB_OUTPUT"
          echo "### Releasing ${version} (previous: ${previous:-none}) from \`${GITHUB_SHA::7}\`" >> "$GITHUB_STEP_SUMMARY"

  build:
    name: Build
    needs: [plan]
    uses: ./.github/workflows/build.yml

  tests:
    name: Tests
    needs: [plan]
    uses: ./.github/workflows/tests.yml

  release:
    name: Release ${{ needs.plan.outputs.version }}
    needs: [plan, build, tests]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # tag + release
    env:
      VERSION: ${{ needs.plan.outputs.version }}
      PREVIOUS: ${{ needs.plan.outputs.previous }}
      GH_TOKEN: ${{ github.token }}
    outputs:
      sha256: ${{ steps.asset.outputs.sha256 }}
    steps:
      - uses: actions/checkout@v7

      # the very plugin.wasm the Build + Tests jobs of this run verified
      - uses: actions/download-artifact@v8
        with:
          name: wasm-file
          path: dist

      - name: Prepare the release asset
        id: asset
        run: |
          mkdir release
          cp dist/plugin.wasm release/sqlc-gen-ruby.wasm
          sha256=$(sha256sum release/sqlc-gen-ruby.wasm | awk '{ print $1 }')
          echo "${sha256}  sqlc-gen-ruby.wasm" > release/sqlc-gen-ruby.wasm.sha256
          echo "sha256=${sha256}" >> "$GITHUB_OUTPUT"

      - name: Write the release notes
        env:
          SHA256: ${{ steps.asset.outputs.sha256 }}
        run: |
          generated=$(gh api "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
            -f tag_name="${VERSION}" -f target_commitish="${GITHUB_SHA}" \
            ${PREVIOUS:+-f previous_tag_name="${PREVIOUS}"} --jq .body)
          {
            echo "Plugin sha256: \`${SHA256}\`"
            echo
            echo "## Usage"
            echo '```yaml'
            echo "version: '2'"
            echo "plugins:"
            echo "- name: ruby"
            echo "  wasm:"
            echo "    url: https://github.com/${GITHUB_REPOSITORY}/releases/download/${VERSION}/sqlc-gen-ruby.wasm"
            echo "    sha256: ${SHA256}"
            echo '```'
            echo
            echo "${generated}"
          } > release/notes.md
          cat release/notes.md >> "$GITHUB_STEP_SUMMARY"

      - name: Create the release (tag ${{ env.VERSION }})
        if: ${{ !inputs.dry_run }}
        run: |
          gh release create "${VERSION}" \
            release/sqlc-gen-ruby.wasm release/sqlc-gen-ruby.wasm.sha256 \
            --target "${GITHUB_SHA}" \
            --title "${VERSION}" \
            --notes-file release/notes.md \
            ${{ inputs.draft && '--draft' || '' }}

  # a user's view of the release: download it by its public URL, check the checksum and generate code with sqlc
  verify:
    name: Verify the published release
    needs: [plan, release]
    if: ${{ !inputs.dry_run && !inputs.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VERSION: ${{ needs.plan.outputs.version }}
      SHA256: ${{ needs.release.outputs.sha256 }}
    steps:
      - uses: actions/checkout@v7

      - name: Load tool versions
        run: grep -E '^[A-Z_]+=' scripts/tool-versions.env >> "$GITHUB_ENV"

      - uses: sqlc-dev/setup-sqlc@v5
        with:
          sqlc-version: '${{ env.SQLC_VERSION }}'

      - name: sqlc diff with the released plugin
        run: |
          sed -E -e "s#^([[:space:]]*url:[[:space:]]*).*#\1https://github.com/${GITHUB_REPOSITORY}/releases/download/${VERSION}/sqlc-gen-ruby.wasm#" \
                 -e "s#^([[:space:]]*sha256:[[:space:]]*).*#\1${SHA256}#" sqlc.ci.yaml > sqlc.release.yaml
          sqlc -f sqlc.release.yaml diff
